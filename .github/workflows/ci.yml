name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - name: Test the Hermes plugin contract
        run: python3 -m unittest discover -s integrations/hermes/tests -v
      - name: Test the Python supervisor contract
        run: python3 -m unittest discover -s integrations/python/tests -v
      - run: cargo test --all-targets

  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned package tooling
        run: python3 -m pip install build==1.6.1 twine==7.0.0
      - name: Build the Python distributions
        run: python3 -m build integrations/python --outdir dist/python
      - name: Check the Python distribution metadata
        run: python3 -m twine check dist/python/*
      - name: Verify the Python distribution boundary
        run: python3 integrations/python/tests/verify_distribution.py dist/python
      - name: Upload the verified Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jet-browser-python-package
          path: dist/python
          if-no-files-found: error
          retention-days: 14

  standalone:
    needs: python-package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download the verified Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jet-browser-python-package
          path: dist/python
      - name: Install the exact verified Python wheel
        run: python3 -m pip install --no-index --no-deps dist/python/*.whl
      - name: Build the standalone runtime for Action acceptance
        run: docker build -f Dockerfile.standalone -t jet-browser:ci .
      - name: Build the MCP verifier image
        run: docker build -f Dockerfile.mcp -t jet-browser-mcp:ci .
      - name: Exercise the root GitHub Action
        uses: ./
        with:
          image: jet-browser:ci
          pull: 'false'
      - name: Exercise the Docker-only quick start
        run: sh scripts/try-jet.sh
      - name: Exercise the Python supervisor against the real runtime
        run: python3 examples/python_quickstart.py --image jet-browser:ci
      - name: Exercise page isolation and bounded stability
        run: >-
          npm run stability --
          --no-build
          --image=jet-browser:ci
          --output=benchmarks/results/stability-ci.json
      - name: Upload the stability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jet-browser-stability-${{ github.run_id }}
          path: benchmarks/results/stability-ci.json
          if-no-files-found: error
          retention-days: 14
      - name: Install MCP smoke-test dependencies
        run: npm ci
      - name: Exercise the MCP container entry point
        run: node scripts/mcp-container-smoke.mjs jet-browser-mcp:ci

  arm64-standalone:
    needs: python-package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Confirm the native ARM64 runner
        run: |
          test "$(uname -m)" = aarch64
          test "$(docker info --format '{{.Architecture}}')" = aarch64
      - name: Install MCP smoke-test dependencies
        run: npm ci
      - name: Download the verified Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jet-browser-python-package
          path: dist/python
      - name: Install the exact verified Python wheel
        run: python3 -m pip install --no-index --no-deps dist/python/*.whl
      - name: Build the native ARM64 runtime
        run: |
          docker build -f Dockerfile.standalone -t jet-browser:arm64 .
          test "$(docker image inspect jet-browser:arm64 --format '{{.Architecture}}')" = arm64
      - name: Exercise the native ARM64 runtime through the root Action
        uses: ./
        with:
          image: jet-browser:arm64
          pull: 'false'
          platform: linux/arm64
      - name: Exercise the Python supervisor on native ARM64
        run: python3 examples/python_quickstart.py --image jet-browser:arm64 --platform linux/arm64
      - name: Build the native ARM64 MCP verifier
        run: |
          docker build -f Dockerfile.mcp -t jet-browser-mcp:arm64 \
            --build-arg JET_BROWSER_RUNTIME_IMAGE=jet-browser:arm64 \
            --build-arg JET_BROWSER_RUNTIME_PLATFORM=linux/arm64 .
          test "$(docker image inspect jet-browser-mcp:arm64 --format '{{.Architecture}}')" = arm64
      - name: Exercise both MCP tools against the native ARM64 runtime
        run: node scripts/mcp-container-smoke.mjs jet-browser-mcp:arm64 linux/arm64 jet-browser:arm64
