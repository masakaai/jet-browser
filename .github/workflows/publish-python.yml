name: publish-python

on:
  workflow_run:
    workflows: [publish-container]
    types: [completed]

concurrency:
  group: publish-python-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate the stable release selector
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify the release and package versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version="${RELEASE_TAG#v}"
          test "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" = "$version"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("integrations/python/pyproject.toml", "rb"))["project"]["version"])')" = "$version"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            "$RUNNER_TEMP/release.json" >/dev/null

      - name: Install pinned package tooling
        run: python3 -m pip install build==1.6.1 twine==7.0.0

      - name: Build the release distributions
        run: python3 -m build integrations/python --outdir dist/python

      - name: Check the release distribution metadata
        run: python3 -m twine check dist/python/*

      - name: Verify the release distribution boundary
        run: python3 integrations/python/tests/verify_distribution.py dist/python

      - name: Retain the verified release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jet-browser-python-package
          path: dist/python
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/jet-browser
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jet-browser-python-package
          path: dist/python

      - name: Publish the distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python
          attestations: true
