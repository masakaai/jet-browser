[package]
name = "jet-browser"
version = "0.7.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "jet-wpe"
path = "rust/main.rs"

[lib]
path = "rust/lib.rs"
