name: Jet Browser Runtime Smoke Test
description: Verify the Jet Browser WPE WebKit runtime with native input, DOM checks, and PNG capture.
author: MASAKA

branding:
  icon: check-circle
  color: orange

inputs:
  image:
    description: Public or locally built Jet Browser image to verify.
    required: false
    default: ghcr.io/masakaai/jet-browser@sha256:5884204e128a3e5bb17634078affdf28d1933d2745752cee3bc74235ed316cec
  pull:
    description: Pull the image before verification; set to false for an existing local image.
    required: false
    default: 'true'
  platform:
    description: OCI platform of the runtime image. Empty selects the native Linux runner architecture.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Resolve the native runtime platform
      id: resolve-platform
      shell: bash
      env:
        JET_BROWSER_PULL: ${{ inputs.pull }}
        JET_BROWSER_PLATFORM_INPUT: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "Jet Browser currently requires a Linux Docker runner." >&2
          exit 1
        fi
        command -v docker >/dev/null
        case "$JET_BROWSER_PULL" in
          true|false) ;;
          *) echo "pull must be true or false" >&2; exit 1 ;;
        esac
        platform="$JET_BROWSER_PLATFORM_INPUT"
        if [ -z "$platform" ]; then
          case "$(uname -m)" in
            x86_64) platform=linux/amd64 ;;
            aarch64|arm64) platform=linux/arm64 ;;
            *) echo "unsupported Linux runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
        fi
        case "$platform" in
          linux/amd64|linux/arm64) ;;
          *) echo "platform must be linux/amd64 or linux/arm64" >&2; exit 1 ;;
        esac
        printf 'platform=%s\n' "$platform" >> "$GITHUB_OUTPUT"

    - name: Enable the WPE browser sandbox
      shell: bash
      run: |
        set -euo pipefail
        ensure_sysctl() {
          local file="$1" key="$2" expected="$3" current
          [ -e "$file" ] || return 0
          current="$(cat "$file")"
          [ "$current" = "$expected" ] && return 0
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "$key must be $expected before Jet Browser runs on a self-hosted runner." >&2
            exit 1
          fi
          sudo sysctl -w "$key=$expected"
          [ "$(cat "$file")" = "$expected" ]
        }
        ensure_sysctl /proc/sys/kernel/unprivileged_userns_clone kernel.unprivileged_userns_clone 1
        ensure_sysctl /proc/sys/kernel/apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_userns 0

    - name: Pull the released runtime image
      if: ${{ inputs.pull == 'true' }}
      shell: bash
      env:
        JET_BROWSER_IMAGE: ${{ inputs.image }}
        JET_BROWSER_PLATFORM: ${{ steps.resolve-platform.outputs.platform }}
      run: docker pull --platform="$JET_BROWSER_PLATFORM" "$JET_BROWSER_IMAGE"

    - name: Exercise browser startup, native input, DOM, and PNG capture
      shell: bash
      env:
        DOCKER_DEFAULT_PLATFORM: ${{ steps.resolve-platform.outputs.platform }}
        JET_BROWSER_IMAGE: ${{ inputs.image }}
      run: node "$GITHUB_ACTION_PATH/scripts/standalone-smoke.mjs" --no-build
