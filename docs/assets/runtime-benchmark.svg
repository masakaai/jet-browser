<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="jet-runtime-benchmark-title jet-runtime-benchmark-desc">
  <title id="jet-runtime-benchmark-title">Jet Browser reproducible runtime benchmark</title>
  <desc id="jet-runtime-benchmark-desc">Horizontal bar charts compare median time to a verified browser page and median active container memory for Jet Browser and pinned self-hosted browser implementations. Lower is better.</desc>
  <rect width="1200" height="700" fill="#f4f2ec"/>
  <text x="48" y="42" fill="#8a817b" font-size="12" font-family="'Space Mono', monospace" letter-spacing="2">JET BROWSER · REPRODUCIBLE RUNTIME BENCHMARK</text>
  <text x="48" y="88" fill="#292523" font-size="38" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Verified browser runtime, measured end to end.</text>
  <text x="48" y="122" fill="#726a65" font-size="16" font-family="'DM Sans', Arial, sans-serif">Same Linux host · offline fixture · 2 CPU · 1 GiB · 2026-10-07 · lower is better</text>
  <g><rect x="48" y="152" width="536" height="430" rx="22" fill="#fff" stroke="#d9d6cf"/><text x="80" y="200" fill="#292523" font-size="25" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Browser ready</text><text x="80" y="228" fill="#726a65" font-size="12" font-family="'Space Mono', monospace">P50 · LOWER IS BETTER</text><rect x="430" y="176" width="122" height="36" rx="9" fill="#fff1e7" stroke="#eeb28a"/><text x="491" y="200" fill="#d85f18" font-size="15" font-weight="700" font-family="'DM Sans', Arial, sans-serif" text-anchor="middle">73% lower</text><text x="552" y="230" fill="#8a817b" font-size="11" font-family="'DM Sans', Arial, sans-serif" text-anchor="end">vs Browserless</text><text x="80" y="281" fill="#292523" font-size="15" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Jet Browser</text><text x="552" y="281" fill="#d85f18" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">1445.25 ms</text><rect x="80" y="294" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="80" y="294" width="68" height="18" rx="9" fill="#e87532"/><text x="80" y="351" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Browser Use</text><text x="552" y="351" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">6374.59 ms</text><rect x="80" y="364" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="80" y="364" width="301" height="18" rx="9" fill="#c8c6c0"/><text x="80" y="421" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Steel Browser</text><text x="552" y="421" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">8490.13 ms</text><rect x="80" y="434" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="80" y="434" width="401" height="18" rx="9" fill="#c8c6c0"/><text x="80" y="491" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Browserless</text><text x="552" y="491" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">5292.05 ms</text><rect x="80" y="504" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="80" y="504" width="250" height="18" rx="9" fill="#c8c6c0"/><text x="80" y="562" fill="#726a65" font-size="12" font-family="'Space Mono', monospace">7/7 PASSED · MEDIAN OF VERIFIED RUNS</text></g>
  <g><rect x="616" y="152" width="536" height="430" rx="22" fill="#fff" stroke="#d9d6cf"/><text x="648" y="200" fill="#292523" font-size="25" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Active memory</text><text x="648" y="228" fill="#726a65" font-size="12" font-family="'Space Mono', monospace">P50 · LOWER IS BETTER</text><rect x="998" y="176" width="122" height="36" rx="9" fill="#fff1e7" stroke="#eeb28a"/><text x="1059" y="200" fill="#d85f18" font-size="15" font-weight="700" font-family="'DM Sans', Arial, sans-serif" text-anchor="middle">33% lower</text><text x="1120" y="230" fill="#8a817b" font-size="11" font-family="'DM Sans', Arial, sans-serif" text-anchor="end">vs Browser Use</text><text x="648" y="281" fill="#292523" font-size="15" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Jet Browser</text><text x="1120" y="281" fill="#d85f18" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">189.6 MiB</text><rect x="648" y="294" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="648" y="294" width="179" height="18" rx="9" fill="#e87532"/><text x="648" y="351" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Browser Use</text><text x="1120" y="351" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">283.8 MiB</text><rect x="648" y="364" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="648" y="364" width="268" height="18" rx="9" fill="#c8c6c0"/><text x="648" y="421" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Steel Browser</text><text x="1120" y="421" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">424.9 MiB</text><rect x="648" y="434" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="648" y="434" width="401" height="18" rx="9" fill="#c8c6c0"/><text x="648" y="491" fill="#625d59" font-size="15" font-weight="600" font-family="'DM Sans', Arial, sans-serif">Browserless</text><text x="1120" y="491" fill="#625d59" font-size="13" font-weight="700" font-family="'Space Mono', monospace" text-anchor="end">402.2 MiB</text><rect x="648" y="504" width="472" height="18" rx="9" fill="#ebe9e3"/><rect x="648" y="504" width="380" height="18" rx="9" fill="#c8c6c0"/><text x="648" y="562" fill="#726a65" font-size="12" font-family="'Space Mono', monospace">7/7 PASSED · MEDIAN OF VERIFIED RUNS</text></g>
  <line x1="48" y1="620" x2="1152" y2="620" stroke="#d9d6cf" stroke-width="1"/>
  <rect x="48" y="648" width="18" height="18" rx="9" fill="#e87532"/><text x="78" y="662" fill="#292523" font-size="13" font-weight="700" font-family="'DM Sans', Arial, sans-serif">Jet Browser</text>
  <rect x="210" y="648" width="18" height="18" rx="9" fill="#c8c6c0"/><text x="240" y="662" fill="#726a65" font-size="13" font-family="'DM Sans', Arial, sans-serif">Pinned upstream runtime</text>
  <text x="1152" y="656" fill="#726a65" font-size="11" font-family="'Space Mono', monospace" text-anchor="end">7 RUNS EACH · RAW JSON + SOURCE LOCK IN /BENCHMARKS</text>
  <text x="1152" y="678" fill="#8a817b" font-size="11" font-family="'DM Sans', Arial, sans-serif" text-anchor="end">Cold container start → verified title + DOM + JavaScript + PNG</text>
</svg>
